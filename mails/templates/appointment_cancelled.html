<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cita Cancelada</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #ffffff; color: #2e5077; padding: 20px;">
    <div style="max-width: 600px; margin: auto; border: 1px solid #4da1a9; border-radius: 8px; padding: 20px;">
        <h2 style="color: #2e5077;">Hola {{ user_name }},</h2>
        <p>Lamentamos informarte que tu cita con el doctor <strong>{{ doctor_name }}</strong> ha sido cancelada.</p>
        <p><strong>Fecha y hora de la cita cancelada:</strong> {{ appointment_date }}</p>
        <p>Si deseas reprogramar, por favor visita nuestro sitio o contáctanos directamente.</p>
        <p style="margin-top: 40px;">Gracias,<br>El equipo de atención médica</p>
    </div>
</body>
</html>
