<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedOnline - Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</head>
<body class="d-flex flex-column min-vh-100">
{% include '_navBar.html' %}
<div class="container flex-grow-1 my-5">
    <div class="text-center my-5">
        <img src="{% static 'img/logo.png' %}" alt="MedOnline Logo" class="mb-3" style="height: 82px"/>
        <h1 class="text-title">Recuperar Contraseña</h1>
    </div>
    <div class="container flex-grow-1 my-5 d-flex justify-content-center align-items-center">
        <div class="w-100" style="max-width: 70vh">
            <form id="recuperarForm" class="w-100" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label text-second">Correo Electrónico</label>
                    <input type="email" class="form-control" id="id_email" name="email" required>
                    <div class="form-text">Ingrese el correo electrónico asociado a su cuenta</div>
                </div>
                <div id="messageContainer" class="mb-3" style="display: none;">
                    <div id="message" class="alert" role="alert"></div>
                </div>
                <div id="spinner" class="text-center mb-3" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
                <button type="submit" class="btn w-100 primary-color fw-bold" style="color: #FFFFFF">ENVIAR ENLACE DE RECUPERACIÓN</button>
            </form>
        </div>
    </div>
    <div class="mt-5 text-center">
        <span>¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-decoration-none text-second">Iniciar sesión</a></span>
    </div>
</div>
{% include '_footer.html' %}
<script>
    document.getElementById('recuperarForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        const email = formData.get('email');
        const submitButton = form.querySelector('button[type="submit"]');

        submitButton.disabled = true;
        submitButton.innerText = 'Enviando...';
        
        document.getElementById('spinner').style.display = 'block';
        
        try {
            const response = await fetch("{% url 'send_reset_email' %}", {
                method: 'POST',
                body: new URLSearchParams({
                    'email': email,
                    'csrfmiddlewaretoken': formData.get('csrfmiddlewaretoken')
                }),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            });

            const data = await response.json();
            
            document.getElementById('spinner').style.display = 'none';
            
            const messageContainer = document.getElementById('messageContainer');
            const messageElement = document.getElementById('message');
            messageContainer.style.display = 'block';
            
            if (response.ok) {
                messageElement.className = 'alert alert-success';
                messageElement.innerText = data.message;
                setTimeout(() => {
                    window.location.href = "{% url 'login' %}";
                }, 2000);
            } else {
                messageElement.className = 'alert alert-danger';
                messageElement.innerText = data.error || 'Ocurrió un error. Por favor, intente nuevamente.';
                submitButton.disabled = false;
                submitButton.innerText = 'ENVIAR ENLACE DE RECUPERACIÓN';
            }
        } catch (error) {
            document.getElementById('spinner').style.display = 'none';

            const messageContainer = document.getElementById('messageContainer');
            const messageElement = document.getElementById('message');
            messageContainer.style.display = 'block';
            messageElement.className = 'alert alert-danger';
            messageElement.innerText = 'Ocurrió un error de conexión. Por favor, intente nuevamente.';

            submitButton.disabled = false;
            submitButton.innerText = 'ENVIAR ENLACE DE RECUPERACIÓN';
        }
    });
</script>
</body>
</html>
