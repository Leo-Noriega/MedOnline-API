<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva de Cita | MedOnline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.min.css"/>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .btn-primary {
      background-color: #2b446d;
      border: none;
    }
    .btn-primary:hover {
      background-color: #1e3251;
    }
    .section-title {
      font-weight: 600;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10 col-12">
        <div class="text-center mb-4">
          <img src="your-logo.png" alt="MedOnline Logo" height="50" />
        </div>
        <h2 class="text-center mb-4">Reserva de Cita</h2>

        <form>
          <div class="mb-4">
            <p class="section-title">Información personal</p>

            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre:</label>
              <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required />
            </div>

            <div class="mb-3">
              <label for="apellidos" class="form-label">Apellidos:</label>
              <input type="text" class="form-control" id="apellidos" placeholder="Apellido 1 Apellido 2" required />
            </div>

            <p class="text-muted small">
              Puedes cambiar tu información personal en la
              <a href="#">configuración de tu cuenta</a>.
            </p>

            <div class="mb-3">
              <label for="fecha" class="form-label">Fecha de nacimiento:</label>
              <input type="date" class="form-control" id="fecha" required />
            </div>

            <div class="mb-3">
              <label for="telefono" class="form-label">Información de contacto:</label>
              <input type="tel" class="form-control" id="telefono" />
            </div>

            <div class="mb-3">
              <label for="comentario" class="form-label">
                Comentario para el especialista (opcional):
              </label>
              <textarea class="form-control" id="comentario" rows="3"
                placeholder="Puedes añadir cualquier comentario que sea de interés para el especialista"></textarea>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <p class="mb-1"><strong>Nombre especialista</strong></p>
              <p class="mb-1 text-muted">Especialidad</p>
              <p class="mb-1"><i class="bi bi-calendar"></i> Fecha dd/mm/aaaa 00:00</p>
              <p class="mb-0"><i class="bi bi-geo-alt"></i> Ubicación del consultorio</p>
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">CONFIRMAR</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
  <script>
    const phoneInput = document.querySelector("#telefono");
    window.intlTelInput(phoneInput, {
      initialCountry: "mx",
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.min.js"
    });
  </script>
</body>
</html>
