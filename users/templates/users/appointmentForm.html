<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reserva de Cita | MedOnline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.min.css"/>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .btn-primary {
            background-color: #2b446d;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1e3251;
        }

        .section-title {
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-12">
            <div class="text-center mb-4">
                <img src="{% static '/img/logo.png' %}" alt="MedOnline Logo" height="50"/>
            </div>
            <h2 class="text-center mb-4">Reserva de Cita</h2>
            <form id="appointmentForm">
                <div class="mb-4">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required/>
                    </div>

                    <div class="mb-3">
                        <label for="apellidos" class="form-label">Apellidos:</label>
                        <input type="text" class="form-control" id="apellidos" placeholder="Apellido 1 Apellido 2"
                               required/>
                    </div>

                    <div class="mb-3">
                        <label for="fecha" class="form-label">Fecha de nacimiento:</label>
                        <input type="date" class="form-control" id="fecha" required/>
                    </div>

                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono:</label>
                        <input type="tel" class="form-control" id="telefono"/>
                    </div>

                    <!-- Detalles de la cita -->
                    <div class="mb-3">
                        <label for="dateAppointment" class="form-label">Fecha de la cita:</label>
                        <input type="date" class="form-control" id="dateAppointment" required/>
                    </div>

                    <div class="mb-3">
                        <label for="hora" class="form-label">Hora de la cita:</label>
                        <input type="time" class="form-control" id="hora" required/>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Consultorio:</label>
                        <select class="form-select" id="address" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="comentario" class="form-label">Comentario para el especialista (opcional):</label>
                        <textarea class="form-control" id="comentario" rows="3"></textarea>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">CONFIRMAR</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
<script>
    const phoneInput = document.querySelector("#telefono");
    window.intlTelInput(phoneInput, {
        initialCountry: "mx",
        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.min.js"
    });


</script>
<script>
    const doctorId = "{{ doctorId }}";
    const selectAddress = document.querySelector("#address");

    const endpoint = `/especialista/api/address/${doctorId}/`;

    fetch(endpoint)
        .then(response => response.json())
        .then(data => {
            if (data.addresses) {
                data.addresses.forEach(address => {
                    const option = document.createElement("option");
                    option.value = address.id;
                    option.textContent = `${address.clinic_name}, ${address.street}, ${address.city}, ${address.state} (${address.postal_code})`;
                    selectAddress.appendChild(option);
                });
            } else {
                console.error("No se encontraron direcciones.");
            }
        })
        .catch(error => console.error("Error al obtener direcciones:", error));
</script>

<script>
    document.getElementById("appointmentForm").addEventListener("submit", function (event) {
        event.preventDefault();
        // datos del formulario
        const nombre = document.getElementById("nombre").value.trim();
        const apellidos = document.getElementById("apellidos").value.trim();
        const fechaNacimiento = document.getElementById("fecha").value;
        const telefono = document.getElementById("telefono").value.trim();
        const fechaCita = document.getElementById("dateAppointment").value;
        const horaCita = document.getElementById("hora").value;
        const direccionId = document.getElementById("address").value;
        const comentario = document.getElementById("comentario").value;


        // Check if the "Nombre" field is empty or contains only spaces
        if (nombre === "") {
            console.log("Campo inválido");
            Swal.fire({
                icon: "error",
                title: "Campo inválido",
                text: "El campo 'Nombre' no puede estar vacío o contener solo espacios.",
            });
            return; // Stop form submission
        }

        // Check if the "Apellidos" field is empty or contains only spaces
        if (apellidos === "") {
            console.log("Campo inválido");
            Swal.fire({
                icon: "error",
                title: "Campo inválido",
                text: "El campo 'Apellidos' no puede estar vacío o contener solo espacios.",
            });
            return; // Stop form submission
        }
        // Check if the "Fecha de nacimiento" field is empty
        if (fechaNacimiento === "") {
            console.log("Campo inválido");
            Swal.fire({
                icon: "error",
                title: "Campo inválido",
                text: "El campo 'Fecha de nacimiento' no puede estar vacío.",
            });
            return; // Stop form submission
        }

        // Validate the "Teléfono" field to ensure it contains exactly 10 digits
        const phoneRegex = /^\d{10}$/;
        if (!phoneRegex.test(telefono)) {
            console.log("Campo inválido");
            Swal.fire({
                icon: "error",
                title: "Campo inválido",
                text: "El campo 'Teléfono' debe contener exactamente 10 dígitos numéricos.",
            });
            return; // Stop form submission
        }

        // Check if the "Fecha de la cita" field is empty
        if (fechaCita === "") {
            console.log("Campo inválido");
            Swal.fire({
                icon: "error",
                title: "Campo inválido",
                text: "El campo 'Fecha de la cita' no puede estar vacío.",
            });
            return; // Stop form submission
        }
        // Check if the "Hora de la cita" field is empty
        if (horaCita === "") {
            console.log("Campo inválido");
            Swal.fire({
                icon: "error",
                title: "Campo inválido",
                text: "El campo 'Hora de la cita' no puede estar vacío.",
            });
            return; // Stop form submission
        }



        // formato la fecha y hora de la cita
        const fechaHoraCita = `${fechaCita}T${horaCita}:00`;

        //  de la solicitud
        const postData = {
            user: 3,
            patient_name: nombre,
            patient_surnames: apellidos,
            birthdate: fechaNacimiento,
            phone: telefono,
            doctor: doctorId,
            address: direccionId,
            appointment_date: fechaHoraCita,
            note: comentario,
            status: 1,
        };

        fetch("/appointments/api/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(postData)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Error al crear la cita.");
                }
                return response.json();
            })
            .then(data => {
                Swal.fire({
                    icon: "success",
                    title: "Cita creada exitosamente",
                    text: "Tu cita ha sido registrada correctamente.",
                });
                console.log(data);
            })
            .catch(error => {
                console.error("Error:", error);
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: "Ocurrió un error al intentar crear la cita.",
                });
            });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
