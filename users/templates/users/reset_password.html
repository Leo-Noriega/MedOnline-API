<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedOnline - Restablecer Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</head>
<body class="d-flex flex-column min-vh-100">
{% include '_navBar.html' %}
<div class="container flex-grow-1 my-5">
    <div class="text-center my-5">
        <img src="{% static 'img/logo.png' %}" alt="MedOnline Logo" class="mb-3" style="height: 82px"/>
        <h1 class="text-title">Restablecer Contraseña</h1>
    </div>
    <div class="container flex-grow-1 my-5 d-flex justify-content-center align-items-center">
        <div class="w-100" style="max-width: 70vh">
            <form id="resetForm" class="w-100" method="POST">
                {% csrf_token %}
                <input type="hidden" id="id_token" name="token" value="{{ token }}">
                <div class="mb-3">
                    <label for="id_password" class="form-label text-second">Nueva Contraseña</label>
                    <input type="password" class="form-control" id="id_password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="id_confirm_password" class="form-label text-second">Confirmar Contraseña</label>
                    <input type="password" class="form-control" id="id_confirm_password" name="confirm_password" required>
                </div>
                <div id="messageContainer" class="mb-3" style="display: none;">
                    <div id="message" class="alert" role="alert"></div>
                </div>
                <div id="spinner" class="text-center mb-3" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
                <button type="submit" class="btn w-100 primary-color fw-bold" style="color: #FFFFFF">RESTABLECER CONTRASEÑA</button>
            </form>
        </div>
    </div>
</div>
{% include '_footer.html' %}
<script>
    document.getElementById('resetForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        const token = formData.get('token');
        const password = formData.get('password');
        const confirmPassword = formData.get('confirm_password');
        
        if (password !== confirmPassword) {
            const messageContainer = document.getElementById('messageContainer');
            const messageElement = document.getElementById('message');
            messageContainer.style.display = 'block';
            messageElement.className = 'alert alert-danger';
            messageElement.innerText = 'Las contraseñas no coinciden';
            return;
        }
        
        document.getElementById('spinner').style.display = 'block';
        
        try {
            const response = await fetch("{% url 'reset_password' %}", {
                method: 'POST',
                body: new URLSearchParams({
                    'token': token,
                    'password': password,
                    'csrfmiddlewaretoken': formData.get('csrfmiddlewaretoken')
                }),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            });

            const data = await response.json();
            
            document.getElementById('spinner').style.display = 'none';
            
            const messageContainer = document.getElementById('messageContainer');
            const messageElement = document.getElementById('message');
            messageContainer.style.display = 'block';
            
            if (response.ok) {
                messageElement.className = 'alert alert-success';
                messageElement.innerText = data.message;
                setTimeout(() => {
                    window.location.href = "{% url 'login' %}";
                }, 3000);
            } else {
                messageElement.className = 'alert alert-danger';
                messageElement.innerText = data.error || 'Ocurrió un error. Por favor, intente nuevamente.';
            }
        } catch (error) {
            document.getElementById('spinner').style.display = 'none';
            
            const messageContainer = document.getElementById('messageContainer');
            const messageElement = document.getElementById('message');
            messageContainer.style.display = 'block';
            messageElement.className = 'alert alert-danger';
            messageElement.innerText = 'Ocurrió un error de conexión. Por favor, intente nuevamente.';
        }
    });
</script>
</body>
</html>
