{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedOnline - Registro de Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <style>
        .card {
            border: 0px !important;
        }
        .form-control:focus {
            border-color: #2E5077;
            box-shadow: 0 0 0 0.25rem rgba(46, 80, 119, 0.25);
        }
        .btn-primary:hover {
            background-color: #1e3a5f;
            border-color: #1e3a5f;
        }
        .iti {
            width: 100%;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
{% include '_navBar.html' %}
<div class="container flex-grow-1 my-5">
    <div class="text-center mb-4">
        <img src="{% static 'img/logo.png' %}" alt="MedOnline Logo" class="mb-3" style="height: 82px"/>
        <h1 class="text-title">Registro de Paciente</h1>
    </div>

    {% if messages %}
    <div class="row justify-content-center mb-3">
        <div class="col-md-8">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="post" action="{% url 'register_patient' %}" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label text-second">Nombre:</label>
                                <input type="text" class="form-control" id="name" name="name" required 
                                       placeholder="Escribe aquí tu nombre">
                            </div>
                            <div class="col-md-6">
                                <label for="surnames" class="form-label text-second">Apellidos:</label>
                                <input type="text" class="form-control" id="surnames" name="surnames" required 
                                       placeholder="Escribe aquí tus apellidos">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="phone" class="form-label text-second">Teléfono:</label>
                                <input type="tel" class="form-control" id="phone" name="phone" required>
                            </div>
                            <div class="col-md-6">
                                <label for="photo" class="form-label text-second">Selecciona tu foto de perfil:</label>
                                <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label text-second">Correo Electrónico:</label>
                            <input type="email" class="form-control" id="email" name="email" required 
                                   placeholder="Escribe aquí tu correo electrónico">
                        </div>
                        
                        <div class="mb-3">
                            <label for="username" class="form-label text-second">Nombre de usuario:</label>
                            <input type="text" class="form-control" id="username" name="username" required
                                    placeholder="Escribe aquí tu nombre de usuario">
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="password" class="form-label text-second">Contraseña:</label>
                                <input type="password" class="form-control" id="password" name="password" required
                                    placeholder="****************************">
                            </div>
                            <div class="col-md-6">
                                <label for="confirm_password" class="form-label text-second">Repite tu contraseña:</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required
                                    placeholder="****************************">
                            </div>
                        </div>
                        
                        <div class="d-grid mt-5">
                            <button type="submit" class="btn w-100 primary-color fw-bold mt-1 mb-3" style="color: #FFFFFF">REGISTRARME</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <p>¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-decoration-none text-second">Iniciar Sesión</a></p>
            </div>
        </div>
    </div>
</div>
{% include '_footer.html' %}

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Inicializar el input de teléfono
        const phoneInput = window.intlTelInput(document.querySelector("#phone"), {
            initialCountry: "mx",
            preferredCountries: ["mx", "us", "ca"],
            utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"
        });

        // Validación de contraseñas
        document.querySelector('form').addEventListener('submit', function(event) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                event.preventDefault();
                alert('Las contraseñas no coinciden');
            }
            
            // Formatear número de teléfono con código de país
            const phoneNumber = phoneInput.getNumber();
            document.getElementById('phone').value = phoneNumber;
        });
    });
</script>
</body>
</html>
