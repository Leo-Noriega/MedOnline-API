<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedOnline - Encuentra tu Especialista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #2E5077;
            --secondary-color: #198754;
            --background-color: #f8f9fa;
            --text-color: #212529;
            --button-color: #4DA1A9;
            --input-bg: #2A4A6E;
            --input-border: #ced4da;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .hero-section {
            background-color: var(--primary-color);
            padding: 2rem;
            text-align: center;
            color: white;
        }

        .category-card,
        .specialist-card {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .category-card:hover,
        .specialist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .specialist-card i {
            font-size: 2rem;
            color: var(--primary-color);
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .searchButton {
            background-color: #4DA1A9;
            border-radius: 8px;
            border: none;
            color: white;
            padding: 8px 20px;
        }
    </style>

</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-stethoscope"></i> MedOnline</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">¿Quiénes somos?</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Mi cuenta</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section py-4">
        <div class="container text-start">


            <div class="col-12 mt-3"
                style="background-color: #2A4A6E; border-radius: 8px; padding-inline: 10px; padding-block: 10px;">
                <h2>Encuentra tu especialista y pide una cita</h2>
                <div class="row flex-wrap flex-md-nowrap">
                    <div class="col-12 col-md-5 mb-2 mb-md-0">
                        <select class="form-select">
                            <option>Especialidad</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-5 mb-2 mb-md-0">
                        <select class="form-select">
                            <option>Estado</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-2">
                        <button class="searchButton w-100">Buscar</button>
                    </div>
                </div>


            </div>

        </div>
    </section>

    <!-- Categorías -->
    <div class="container mt-4">
        <div id="categorias">
            <h4 class="mt-3">Categorías</h4>
            <div class="row g-3">
                <div class="col-md-3 col-6">
                    <div class="category-card">Psicología</div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="category-card">Dental</div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="category-card">Oftalmología</div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="category-card">Médico General</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mejores Especialistas -->
    <div class="container mt-4">
        <h4>Mejores especialistas</h4>
        <div class="row g-3">
            <div class="col-md-3 col-6">
                <div class="specialist-card"><i class="fas fa-user-md"></i>
                    <p>Nombre</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="specialist-card"><i class="fas fa-user-md"></i>
                    <p>Nombre</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="specialist-card"><i class="fas fa-user-md"></i>
                    <p>Nombre</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="specialist-card"><i class="fas fa-user-md"></i>
                    <p>Nombre</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
