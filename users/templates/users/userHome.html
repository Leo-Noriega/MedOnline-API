<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedOnline - Encuentra tu Especialista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2E5077;
            --secondary-color: #198754;
            --background-color: #f8f9fa;
            --text-color: #212529;
            --button-color: #4DA1A9;
            --input-bg: #2A4A6E;
            --input-border: #ced4da;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .hero-section {
            background-color: var(--primary-color);
            padding: 2rem;
            text-align: center;
            color: white;
        }

        .category-card,
        .specialist-card {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .category-card:hover,
        .specialist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .specialist-card i {
            font-size: 2rem;
            color: var(--primary-color);
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .searchButton {
            background-color: #4DA1A9;
            border-radius: 8px;
            border: none;
            color: white;
            padding: 8px 20px;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
        }

        .appointment-slot {
            background-color: #f0f4ff;
            border-radius: 10px;
            color: #2c6ef5;
            text-align: center;
            padding: 5px 0;
            cursor: pointer;
            font-weight: 500;
        }

        .appointment-slot:hover {
            background-color: #dbe7ff;
        }

        .card-light {
            background-color: #f1f3f5;
            border: none;
        }

        .text-muted-small {
            font-size: 0.85rem;
        }

    </style>
</head>

<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-stethoscope"></i> MedOnline</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">¿Quiénes somos?</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Mi cuenta</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<section class="hero-section py-4">
    <div class="container text-start">
        <div class="col-12 mt-3"
             style="background-color: #2A4A6E; border-radius: 8px; padding-inline: 10px; padding-block: 10px;">
            <h2>Encuentra tu especialista y pide una cita</h2>
            <div class="row flex-wrap flex-md-nowrap">
                <div class="col-12 col-md-5 mb-2 mb-md-0">
                    <select class="form-select" id="specialtySelector">
                        <option>Especialidad</option>
                        {% for specialty in specialities %}
                            <option value="{{ specialty.0 }}"> {{ specialty.1 }} </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-md-5 mb-2 mb-md-0">
                    <select class="form-select" id="stateSelector">
                        <option>Estado</option>
                        {% for state in mexican_states %}
                            <option value="{{ state }}">{{ state }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-md-2">
                    <button class="searchButton w-100">Buscar</button>
                </div>
            </div>
        </div>
    </div>
</section>


<div class="container mt-4" id="results">
    <div class="row g-3">
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Horarios del Doctor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <!-- Horario semanal -->
                        <h6 class="mb-3">Horario semanal:</h6>
                        <div id="schedule">
                            <!-- El horario se renderizará aquí -->
                        </div>
                    </div>
                    <div class="col-md-6">
                        <!-- Reservar cita -->
                        <h6 class="mb-3">Reservar cita:</h6>
                        <div id="appointment-form">
                            <div class="mb-3">
                                <label for="appointment-date" class="form-label">Fecha:</label>
                                <input type="date" class="form-control" id="appointment-date" min="" required>
                            </div>

                            <div class="mb-3">
                                <label for="available-slots" class="form-label">Horarios disponibles:</label>
                                <select class="form-select" id="available-slots" required>
                                    <option value="" selected disabled>Seleccione un horario</option>
                                    <!-- Las opciones se cargarán dinámicamente -->
                                </select>
                            </div>

                            <p class="mb-2">Duración de consulta: <span id="consultation-duration">--</span> minutos</p>

                            <button type="button" class="btn btn-primary w-100" id="reserve-appointment-btn">
                                Reservar cita
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
<script>

    // Variables globales
    const weekdays = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
    let scheduleElement;
    let currentDoctorData = {}; // Para almacenar información del doctor actual

    // Función para convertir nanosegundos a minutos
    function nanoToMinutes(nanoseconds) {
        // Django DurationField guarda valores en nanosegundos
        // Dividimos por 60 * 1000000000 para obtener minutos
        return Math.floor(nanoseconds / 60000000000);
    }

    // Función para formatear la hora
    function formatTime(hours, minutes) {
        return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
    }

    // Función para generar horarios disponibles
    function generateTimeSlots(startTime, endTime, durationMinutes) {
        const slots = [];

        // Convertir strings de hora a objetos Date para manipulación
        const [startHour, startMinute] = startTime.split(':').map(Number);
        const [endHour, endMinute] = endTime.split(':').map(Number);

        let currentHour = startHour;
        let currentMinute = startMinute;

        // Generar slots de tiempo
        while (currentHour < endHour || (currentHour === endHour && currentMinute < endMinute)) {
            // Agregar el horario actual
            slots.push(formatTime(currentHour, currentMinute));

            // Avanzar según la duración de la consulta
            currentMinute += durationMinutes;

            // Ajustar horas si los minutos exceden 60
            if (currentMinute >= 60) {
                currentHour += Math.floor(currentMinute / 60);
                currentMinute = currentMinute % 60;
            }
        }

        return slots;
    }

    // Función para renderizar el horario semanal
    function renderSchedule(data = []) {
        scheduleElement = document.getElementById('schedule');
        if (!scheduleElement) {
            console.error("El elemento con id 'schedule' no se encontró en el DOM");
            return;
        }

        const rows = weekdays.map((day, index) => {
            const dayData = data.find(schedule => schedule.weekday === index + 1);
            return `
        <tr>
            <td><p class="text-second m-0 fw-medium">${day}</p></td>
            <td>${dayData ? dayData.start_time : '--'}</td>
            <td>${dayData ? dayData.end_time : '--'}</td>
        </tr>
        `;
        }).join('');

        scheduleElement.innerHTML = `
    <table class="table">
        <thead>
            <tr>
                <th><p class="text-principal m-0">Día</p></th>
                <th><p class="text-principal m-0">Hora de inicio</p></th>
                <th><p class="text-principal m-0">Hora de fin</p></th>
            </tr>
        </thead>
        <tbody>${rows}</tbody>
    </table>
    `;
    }

    // Función para actualizar los horarios disponibles según la fecha seleccionada
    const {DateTime} = luxon;

    function updateAvailableSlots() {
        const dateInput = document.getElementById('appointment-date');
        const slotsSelect = document.getElementById('available-slots');

        if (!dateInput.value || !currentDoctorData.schedule) {
            slotsSelect.innerHTML = '<option value="" selected disabled>Seleccione un horario</option>';
            return;
        }

        // Obtener el día de la semana (0 = Domingo, 1 = Lunes, ..., 6 = Sábado)
        const selectedDate = DateTime.fromISO(dateInput.value, {zone: 'America/Mexico_City'});
        const dayOfWeek = selectedDate.weekday % 7;

        console.log("Selected date:", selectedDate, "Day of week:", dayOfWeek);

        // Buscar el horario para ese día
        const daySchedule = currentDoctorData.schedule.find(s => s.weekday === dayOfWeek);

        if (!daySchedule) {
            slotsSelect.innerHTML = '<option value="" selected disabled>No hay horarios disponibles para este día</option>';
            return;
        }

        // Generar slots basados en la duración de la consulta
        const durationMinutes = nanoToMinutes(currentDoctorData.consultation_time);
        const slots = generateTimeSlots(daySchedule.start_time, daySchedule.end_time, durationMinutes);

        // Actualizar el select con los slots disponibles
        slotsSelect.innerHTML = '<option value="" selected disabled>Seleccione un horario</option>' +
            slots.map(slot => `<option value="${slot}">${slot}</option>`).join('');
    }

    // Función para mostrar el horario y configurar el formulario de citas
    function showSchedule(doctorId) {
        // Establecer la fecha mínima como hoy
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('appointment-date').min = today;

        // Resetear el formulario
        document.getElementById('appointment-date').value = '';
        document.getElementById('available-slots').innerHTML = '<option value="" selected disabled>Seleccione un horario</option>';

        // Obtener los datos del doctor y su horario
        fetch(`/schedule/get_schedule/${doctorId}/`)
            .then(response => {
                if (!response.ok) throw new Error("Error al obtener el horario");
                return response.json();
            })
            .then(data => {
                // Guardar datos del doctor actual
                currentDoctorData = {
                    id: doctorId,
                    schedule: data.schedule,
                    consultation_time: data.doctor?.consultation_time || 1800000000 // Default: 30 minutos
                };

                // Mostrar duración de consulta
                const durationMinutes = nanoToMinutes(currentDoctorData.consultation_time);
                document.getElementById('consultation-duration').textContent = durationMinutes;

                // Renderizar horario
                renderSchedule(data.schedule);
            })
            .catch((error) => console.log(error));
    }

    // Inicializar cuando el DOM está listo
    document.addEventListener("DOMContentLoaded", () => {
        // Inicializar elementos
        scheduleElement = document.getElementById('schedule');

        // Event listener para el cambio de fecha
        document.getElementById('appointment-date').addEventListener('change', updateAvailableSlots);

        // Event listener para el botón de reserva
        document.getElementById('reserve-appointment-btn').addEventListener('click', () => {
            const dateInput = document.getElementById('appointment-date');
            const slotSelect = document.getElementById('available-slots');

            if (!dateInput.value || !slotSelect.value) {
                alert('Por favor, seleccione una fecha y un horario');
                return;
            }

            // Aquí puedes implementar la lógica de envío de la reserva de cita
            const appointmentData = {
                doctor_id: currentDoctorData.id,
                date: dateInput.value,
                time: slotSelect.value
            };

            // Mostrar información de la cita (para pruebas)
            console.log('Datos de la cita:', appointmentData);
            alert(`Cita reservada para el ${dateInput.value} a las ${slotSelect.value}`);

            // Aquí puedes agregar el código para enviar la reserva al servidor
            // Por ejemplo:
            /*
            fetch('/api/appointments/create/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') // Función para obtener el token CSRF
                },
                body: JSON.stringify(appointmentData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Cita reservada con éxito');
                    $('#exampleModal').modal('hide');
                } else {
                    alert('Error al reservar la cita: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al reservar la cita');
            });
            */
        });

        // El resto de tu código existente
        document.querySelector('.searchButton').addEventListener('click', async () => {
            const specialtySelector = document.getElementById('specialtySelector');
            const stateSelector = document.getElementById('stateSelector');
            const specialtyId = specialtySelector.value;
            const state = stateSelector.value;
            if (specialtyId === "Especialidad" || state === "Estado") {
                alert("Por favor selecciona una especialidad y un estado.");
                return;
            }

            try {
                const apiUrl = `http://localhost:8000/users/search-doctors/?specialty_id=${specialtyId}&state=${state}`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`Error: ${response.status}`);
                }

                const data = await response.json();

                // Clear previous results
                const resultsContainer = document.querySelector('#results .row');
                resultsContainer.innerHTML = '';

                // Render a card for each doctor
                data.doctors.forEach(doctor => {
                    const card = `
                <div class="col-lg-6">
                    <div class="card card-light p-4 rounded-4">
                        <div class="d-flex align-items-center">
                            <img src=../../../media/${doctor.photo} alt="Doctor" class="profile-img me-3">
                            <div>
                                <h6 class="mb-0 fw-bold">${doctor.name} ${doctor.surnames}</h6>
                                <p class="mb-1 text-muted">${doctor.specialty}</p>
                            </div>
                        </div>
                        <hr>
                        <h6 class="fw-bold">Dirección</h6>
                        <p class="mb-0">${doctor.clinic_name}, ${doctor.street}, ${doctor.city}, ${doctor.state}, ${doctor.postal_code}</p>
                    </div>
                </div>
                <!-- Right Card: Schedule -->
                <div class="col-lg-6">
                  <div class="card card-light p-4 rounded-4">
                    <div class="text-end mt-3">
                    <!-- Button trigger modal -->
                    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal" onclick="showSchedule(${doctor.id})">
                        Ver horarios
                    </button>
                    </div>
                  </div>
                </div>
                `;
                    resultsContainer.insertAdjacentHTML('beforeend', card);
                });
            } catch (error) {
                console.error("Error al realizar la consulta:", error);
                alert("Ocurrió un error al realizar la consulta.");
            }
        });
    });
</script>
</body>
</html>
