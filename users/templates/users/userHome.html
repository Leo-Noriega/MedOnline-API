<!DOCTYPE html>
<html lang="es">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedOnline - Encuentra tu Especialista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    <style>
        :root {
            --primary-color: #2E5077;
            --secondary-color: #198754;
            --background-color: #f8f9fa;
            --text-color: #212529;
            --button-color: #4DA1A9;
            --input-bg: #2A4A6E;
            --input-border: #ced4da;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .hero-section {
            background-color: var(--primary-color);
            padding: 2rem;
            text-align: center;
            color: white;
        }

        .category-card,
        .specialist-card {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .category-card:hover,
        .specialist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .specialist-card i {
            font-size: 2rem;
            color: var(--primary-color);
        }

        .navbar {
            background-color: var(--primary-color) !important;
        }

        .searchButton {
            background-color: #4DA1A9;
            border-radius: 8px;
            border: none;
            color: white;
            padding: 8px 20px;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
        }

        .appointment-slot {
            background-color: #f0f4ff;
            border-radius: 10px;
            color: #2c6ef5;
            text-align: center;
            padding: 5px 0;
            cursor: pointer;
            font-weight: 500;
        }

        .appointment-slot:hover {
            background-color: #dbe7ff;
        }

        .card-light {
            background-color: #f1f3f5;
            border: none;
        }

        .text-muted-small {
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    {% include 'header.html' %}
    <div class="offcanvas offcanvas-start offcanvas-lg bg-light" data-bs-scroll="true" data-bs-backdrop="false"
        tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel"
        style="width: 200px; top: 56px;">
        <div class="offcanvas-header justify-content-end">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        {%include 'sidebar.html'%}
    </div>

    <!-- Hero Section -->
    <section class="hero-section py-4">
        <div class="container text-start">


            <div class="col-12 mt-3"
                style="background-color: #2A4A6E; border-radius: 8px; padding-inline: 10px; padding-block: 10px;">
                <h2>Encuentra tu especialista y pide una cita</h2>
                <div class="row flex-wrap flex-md-nowrap">
                    <div class="col-12 col-md-5 mb-2 mb-md-0">
                        <select class="form-select" id="specialtySelector">
                            <option>Especialidad</option>
                            {% for specialty in specialities %}
                            <option value="{{ specialty.0 }}"> {{ specialty.1 }} </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12 col-md-5 mb-2 mb-md-0">
                        <select class="form-select" id="stateSelector">
                            <option>Estado</option>
                            {% for state in mexican_states %}
                            <option value="{{ state }}">{{ state }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12 col-md-2">
                        <button class="searchButton w-100">Buscar</button>
                    </div>
                </div>


            </div>

        </div>
    </section>


    <div class="container mt-4" id="results">
        <div class="row g-3">

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="schedule">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>

        function appointment(doctorId) {
            window.location.href = `/users/patient/appointment?doctor_id=${doctorId}`;
        }
        document.addEventListener("DOMContentLoaded", () => {
            const weekdays = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
            const scheduleElement = document.getElementById('schedule')

            const renderSchedule = (data = []) => {
                const rows = weekdays.map((day, index) => {
                    const dayData = data.find(schedule => schedule.weekday === index + 1);
                    return `
        <tr>
            <td><p class="text-second m-0 fw-medium">${day}</p></td>
            <td>${dayData ? dayData.start_time : '--'}</td>
            <td>${dayData ? dayData.end_time : '--'}</td>
        </tr>
    `;
                }).join('');

                scheduleElement.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="text-title">Horario de trabajo</h5>
            <button class="button-edit" id="editButton">Editar</button>
        </div>
            <table class="table">
                <thead>
                    <tr>
                        <th><p class="text-principal m-0">Día</p></th>
                        <th><p class="text-principal m-0">Hora de inicio</p></th>
                        <th><p class="text-principal m-0">Hora de fin</p></th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>

        `;
            }

            function showSchedule(doctorId) {
                fetch(`/schedule/get_schedule/${doctorId}/`)
                    .then(response => {
                        if (!response.ok) throw new Error("Error al obtener el horario");
                        return response.json();
                    })
                    .then(data => renderSchedule(data.schedule))

                    .catch((error) => console.log(error));
            }


            document.querySelector('.searchButton').addEventListener('click', async () => {
                const specialtySelector = document.getElementById('specialtySelector');
                const stateSelector = document.getElementById('stateSelector');
                const specialtyId = specialtySelector.value;
                const state = stateSelector.value;
                if (specialtyId === "Especialidad" || state === "Estado") {
                    alert("Por favor selecciona una especialidad y un estado.");
                    return;
                }

                try {
                    const apiUrl = `http://localhost:8000/users/search-doctors/?specialty_id=${specialtyId}&state=${state}`;
                    const response = await fetch(apiUrl);

                    if (!response.ok) {
                        throw new Error(`Error: ${response.status}`);
                    }

                    const data = await response.json();

                    // Clear previous results
                    const resultsContainer = document.querySelector('#results .row');
                    resultsContainer.innerHTML = '';

                    // Render a card for each doctor
                    data.doctors.forEach(doctor => {
                        const card = `
                    <div class="col-lg-6">
                        <div class="card card-light p-4 rounded-4">
                            <div class="d-flex align-items-center">
                                <img src=../../../media/${doctor.photo} alt="Doctor" class="profile-img me-3">
                                <div>
                                    <h6 class="mb-0 fw-bold">${doctor.name} ${doctor.surnames}</h6>
                                    <p class="mb-1 text-muted">${doctor.specialty}</p>
                                </div>
                            </div>
                            <hr>
                            <h6 class="fw-bold">Dirección</h6>
                            <p class="mb-0">${doctor.clinic_name}, ${doctor.street}, ${doctor.city}, ${doctor.state}, ${doctor.postal_code}</p>
                        </div>
                    </div>
                    <!-- Right Card: Schedule -->
                        <div class="col-lg-6">
                        <div class="card card-light p-4 rounded-4">
                            <div class="row text-center mb-3">
                            <!-- Header Days -->
                            <div class="col fw-bold">Hoy<br><span class="text-muted">1 Mar</span></div>
                            <div class="col fw-bold">Lun<br><span class="text-muted">2 Mar</span></div>
                            <div class="col fw-bold">Mar<br><span class="text-muted">3 Mar</span></div>
                            <div class="col fw-bold">Mie<br><span class="text-muted">4 Mar</span></div>
                            </div>
                            <!-- Time Slots -->

                            <!-- Arrow Button -->
                            <div class="text-end mt-3">
                            <button type="button" class="btn btn-success" onclick="appointment(${doctor.id})">
                                VAgendar cita
                            </button>
                            </div>
                        </div>
                        </div>
                `;
                        resultsContainer.insertAdjacentHTML('beforeend', card);
                    });
                } catch (error) {
                    console.error("Error al realizar la consulta:", error);
                    alert("Ocurrió un error al realizar la consulta.");
                }
            });
        })
    </script>
</body>

</html>
