<!DOCTYPE html>
<html lang="es">

<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>

<body>
    {% include 'header.html' %}
    <div class="offcanvas offcanvas-start offcanvas-lg bg-light" data-bs-scroll="true" data-bs-backdrop="false"
        tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel"
        style="width: 200px; top: 56px;">
        <div class="offcanvas-header justify-content-end">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        {% include 'sidebar.html' %}
    </div>
    
    <main class="p-3">
        <div class="p-2">
            <div class="d-flex align-items-center">
                <h4 class="text-title">Opiniones de mis pacientes</h4>
            </div>
            <hr class="borde-hr" />
        </div>
        <div class="container p-3 rounded bg-section" id="opiniones" data-url="/especialista/{{doctor_id}}/reviews/">
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/sidebar.js' %}"></script>
    <script src="{% static 'js/doctor_services/opinions.js' %}"></script>

</body>

</html>
