<!DOCTYPE html>
<html lang="es">

<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>
    {% include 'header.html' %}
    <div class="offcanvas offcanvas-start offcanvas-lg bg-light" data-bs-scroll="true" data-bs-backdrop="false"
        tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel"
        style="width: 200px; top: 56px;">
        <div class="offcanvas-header justify-content-end">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        {%include 'sidebar.html'%}
    </div>

    <main class="p-3">
        <div class="p-2">
            <div class="d-flex align-items-center">
                <h4 class="text-title">Mi cuenta</h4>
            </div>
            <hr class="borde-hr" />
        </div>

        <div id="info-user" class="rounded p-3 m-auto bg-section my-5" data-user-id="{{ user_id }}">
        </div>

        <div class="rounded m-auto bg-section text p-3">
            <div class="d-flex justify-content-between" id="head-especialidades">
                <h4 class="fw-bolder text-title ">Especialidades</h4>
                <button class="button-edit" onclick="agregar_especialidad()" id="agregar">Agregar</button>
            </div>
            <div id="especialidades">

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/sidebar.js' %}"></script>
    <script src="{% static 'js/toast_alerts.js' %}"></script>
    <script src="{% static 'js/doctor_services/myAccount.js' %}"></script>
</body>

</html>
