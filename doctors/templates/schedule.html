<!DOCTYPE html>
<html lang="es">

<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css" rel="stylesheet">
</head>

<body>
    {% include 'header.html' %}
    <div class="offcanvas offcanvas-start offcanvas-lg bg-light" data-bs-scroll="true" data-bs-backdrop="false"
        tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel"
        style="width: 200px; top: 56px;">
        <div class="offcanvas-header justify-content-end">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        {% include 'sidebar.html' %}
    </div>

    <main class="p-3">
        <div class="p-2">
            <div class="d-flex align-items-center">

                <h4 class="text-title">Mi agenda</h4>
            </div>
            <hr class="borde-hr" />
        </div>
        <div class="container p-3 rounded bg-section" id="schedule" data-doctor-id="{{ doctor_id }}">
        </div>

        <div class="container p-3 rounded bg-section mt-5">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="text-title">Mis citas</h5>
            <div class="text d-flex align-items-center">
                <div class="d-flex align-items-center text me-2">
                    <div class="bg-warning rounded " style="width: 20px; height: 20px;"></div>
                    <span>Pendiente</span>
                </div>
                <div class="d-flex align-items-center text me-2">
                    <div class="bg-success rounded " style="width: 20px; height: 20px;"></div>
                    <span>Confirmada</span>
                </div>
                <div class="d-flex align-items-center text">
                    <div class="primary-color rounded " style="width: 20px; height: 20px;"></div>
                    <span>Completada</span>
                </div>
            </div>
            </div>

            <div id="calendar" data-doctor-id="{{ doctor_id }}" data-doctor-time="{{ doctor_time }}"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/sidebar.js' %}"></script>
    <script src="{% static 'js/toast_alerts.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>
    <script src="{% static 'js/doctor_services/schedule.js' %}"></script>
   
</body>

</html>
