<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    {% include 'header.html' %}
    <div class="offcanvas offcanvas-start offcanvas-lg bg-light" data-bs-scroll="true" data-bs-backdrop="false"
        tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel"
        style="width: 200px; top: 56px;">
        <div class="offcanvas-header justify-content-end">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        {%include 'sidebar.html'%}
    </div>

    <main class="p-3">
        <div class="p-2">
            <div class="d-flex align-items-center">
                <h4 class="text-title">Mis citas</h4>
            </div>
            <hr class="borde-hr" />
        </div>

        <div class="rounded m-auto bg-section text p-3  my-5">
            <div class="d-flex justify-content-between" >
                <h4 class=" text-principal ">Citas</h4>
            </div>
            <div id="appointments" class="rounded p-3 m-auto" data-user-id="{{user_id}}">
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/sidebar.js' %}"></script>
    <script src="{% static 'js/patients_service/myAppointments.js' %}"></script>
    <script src="{% static 'js/toast_alerts.js' %}"></script>
    
</body>
</html>
