<!DOCTYPE html>
<html lang="es">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    <style>
        @media (min-width: 992px) {
            main {
                transition: margin-left 0.5s ease;
            }

            main.shifted {
                margin-left: 200px;
            }

            .offcanvas {
                padding: 20px;
                top: 56px;
            }
        }

        .link-hover.active {
            border-left-color: rgba(30, 128, 145, 0.7);
            background-color: rgba(29, 106, 111, 0.1);
        }

        .link-hover {
            border-left: 4px solid transparent;
            background-color: transparent;
            transition: background-color 0.3s ease, border-left-color 0.3s ease;
        }

        .link-hover:hover {
            border-left-color: rgba(30, 128, 145, 0.7);
            background-color: rgba(29, 106, 111, 0.1);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ccc;
            display: inline-block;
        }

        .status-indicator.active {
            background-color: #28a745;
        }

        .status-indicator.inactive {
            background-color: #dc3545;
        }

        .btn-primary {
            background-color: #4285f4;
            border-color: #4285f4;
        }

        .btn-primary:hover {
            background-color: #2E5077;
            border-color: #2E5077;
        }
    </style>
</head>

<body>
    {% include 'header.html' %}

    <div class="offcanvas offcanvas-start offcanvas-lg bg-light" data-bs-scroll="true" data-bs-backdrop="false"
        tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel"
        style="width: 200px; top: 56px;">
        <div class="offcanvas-header justify-content-end">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        {% include 'admin_sidebar.html' %}
    </div>

    
    <main class="p-3">
        <div class="p-2">
            <div class="d-flex align-items-center">
                <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling"
                    aria-controls="offcanvasScrolling"><i class="bi bi-list"></i></button>
                <h4 class="text-title">Mi cuenta</h4>
            </div>
            <hr class="borde-hr" />
        </div>
    
        <div id="info-admin" class="rounded p-3 m-auto bg-section my-5">
   
        </div>
    </main>
    
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/toast_alerts.js' %}"></script>    <script>
       
                       
                        function getCSRFToken() {
                            const csrfCookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
                            return csrfCookie ? csrfCookie.split('=')[1] : null;
                        }
       function fetchAdminData(callback) {
            const userId = "{{user_id}}";
            fetch(`/admin/get-admin/${userId}/`)
                .then(response => {
                    if (!response.ok) throw new Error('No se pudo obtener la información del administrador');
                    return response.json();
                })
                .then(data => {
                    callback(data);
                })

        }
    
        function renderAdminInfo(data) {
            const mainContainer = document.getElementById('info-admin');
            mainContainer.innerHTML = `
                <div class="d-flex justify-content-between mb-3">
                    <img src="${data.admin.photo || '{% static "media/default.png" %}'}" 
                         class="rounded-circle" alt="foto de perfil" 
                         style="height: 50px; width: 50px;">
                    <button class="button-edit" onclick="editAdmin()">Editar</button>
                </div>
                <div class="text row">
                    ${createField("Nombre", data.admin.name)}
                    ${createField("Apellidos", data.admin.surnames)}
                    ${createField("Usuario", data.admin.username)}
                    ${createField("Teléfono", data.admin.phone)}
                    ${createField("Correo electrónico", data.admin.email)}
                </div>`;
        }
    
        function renderEditForm(data) {
            const mainContainer = document.getElementById('info-admin');
            mainContainer.innerHTML = `
                <div class="d-flex justify-content-start mb-3 align-items-center">
                    <img src="${data.admin.photo || '{% static "media/default.png" %}'}" 
                         class="rounded-circle" alt="foto de perfil" 
                         style="height: 50px; width: 50px;">
                    <input type="file" id="photo-input" style="display: none;">
                    <button class="button-edit" onclick="document.getElementById('photo-input').click()">
                        Cambiar foto
                    </button>
                </div>
                <div class="text row">
                    ${createInputField("Nombre", data.admin.name, "name")}
                    ${createInputField("Apellidos", data.admin.surnames, "surnames")}
                    ${createInputField("Usuario", data.admin.username, "username")}
                    ${createInputField("Teléfono", data.admin.phone, "phone")}
                    ${createInputField("Correo electrónico", data.admin.email, "email")}
                    ${createInputField("Nueva contraseña", "", "password", "password")}
                    ${createInputField("Confirmar contraseña", "", "confirm_password", "password")}
                    <div class="col-12 d-flex justify-content-end my-2">
                        <button class="button-edit mx-3" onclick="fetchAdminData(renderAdminInfo)">
                            Cancelar
                        </button>
                        <button class="button-principal" onclick="updateAdmin('{{user_id}}')">
                            Guardar
                        </button>
                    </div>
                </div>`;
            validaciones();
        }
    
        function updateAdmin(userId) {
            const data = {};
            const fields = ["name", "surnames", "username", "phone", "email", "password", "confirm_password"];
    
            fields.forEach(field => {
                const value = document.getElementById(field)?.value;
                if (value) data[field] = value;
            });
    
            if (data.password && data.password !== data.confirm_password) {
                mostrarToastGlobal({
                    type: 'danger',
                    message: 'Las contraseñas no coinciden'
                });
                return;
            }
    
            delete data.confirm_password;
    
            mostrarToastGlobal({
                type: '',
                message: '¿Está seguro de actualizar la información?',
                buttons: [
                    {
                        id: 'confirmar',
                        label: 'Confirmar',
                        className: 'button-principal',
                        onClick: () => {
                            fetch(`/admin/update-admin/${userId}/`, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-CSRFToken': getCSRFToken()
                                },
                                body: JSON.stringify(data)
                            })
                            .then(response => response.json())
                            .then(result => {
                                if (result.error) {
                                    mostrarToastGlobal({
                                        type: 'danger',
                                        message: result.error
                                    });
                                } else {
                                    mostrarToastGlobal({
                                        type: 'success',
                                        message: 'Información actualizada exitosamente'
                                    });
                                    fetchAdminData(renderAdminInfo);
                                }
                            })
                            .catch(error => {
                                mostrarToastGlobal({
                                    type: 'danger',
                                    message: 'Error al actualizar la información'
                                });
                            });
                        }
                    },
                    {
                        id: 'cancelar',
                        label: 'Cancelar',
                        className: 'button-edit',
                        onClick: () => {}
                    }
                ]
            });
        }
    

        function createField(label, value) {
            return `<div class="col-md-4 col-sm-6 col-12">
                <p class="text-title fw-semibold mb-0">${label}:</p>
                <p>${value || ''}</p>
            </div>`;
        }
    
        function createInputField(label, value, id, type = "text") {
            return `<div class="col-md-4 col-sm-6 col-12 my-2">
                <label class="text-title fw-semibold mb-0">${label}:</label>
                <input id="${id}" class="form-control" type="${type}" value="${value || ''}" />
                <div class="invalid-feedback"></div>
            </div>`;
        }
    
        function editAdmin() {
            fetchAdminData(renderEditForm);
        }
    

        document.addEventListener('DOMContentLoaded', () => {
            fetchAdminData(renderAdminInfo);
        });


    </script>
